<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dzień Dziewczyny 💗</title>
<style>
  :root { --pink:#ff7eb6; --hot:#ff2e88; --soft:#ffe3f0; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--soft); overflow:hidden; text-align:center;
    background:linear-gradient(120deg,#1a0620,#4a0f3d,#8a1c5c,#3a0b44);
    background-size:400% 400%;
    animation:bg 14s ease infinite;
    display:flex; align-items:center; justify-content:center;
  }
  @keyframes bg { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  canvas { position:fixed; inset:0; pointer-events:none; z-index:1; }
  .stage { position:relative; z-index:2; padding:24px; width:100%; max-width:680px; }
  .scene { display:none; animation:in 1s ease both; }
  .scene.on { display:block; }
  @keyframes in { from{opacity:0; transform:scale(.85) translateY(20px)} to{opacity:1; transform:none} }

  .gift { font-size:110px; display:inline-block; cursor:pointer; animation:shake 1.8s ease-in-out infinite; filter:drop-shadow(0 0 30px rgba(255,126,182,.9)); }
  @keyframes shake { 0%,100%{transform:rotate(0) scale(1)} 10%{transform:rotate(-10deg) scale(1.08)} 20%{transform:rotate(10deg) scale(1.08)} 30%{transform:rotate(-8deg)} 40%{transform:rotate(8deg)} 50%{transform:rotate(0)} }
  h1 { font-size:clamp(2rem,8vw,3.6rem); margin:16px 0 8px; color:var(--pink);
       text-shadow:0 0 12px var(--hot),0 0 40px rgba(255,46,136,.7); }
  .hint { opacity:.8; font-size:1.05rem; animation:blink 1.6s infinite; }
  @keyframes blink { 50%{opacity:.35} }

  .count { font-size:clamp(7rem,32vw,13rem); font-weight:800; color:#fff;
           text-shadow:0 0 30px var(--hot),0 0 80px var(--hot); animation:pop .9s ease both; }
  @keyframes pop { 0%{transform:scale(2.4); opacity:0} 40%{opacity:1} 100%{transform:scale(1)} }

  .bigheart { font-size:clamp(7rem,30vw,12rem); display:inline-block; animation:beat 1.1s ease-in-out infinite;
              filter:drop-shadow(0 0 40px var(--hot)); }
  @keyframes beat { 0%,100%{transform:scale(1)} 15%{transform:scale(1.25)} 30%{transform:scale(1)} 45%{transform:scale(1.18)} }

  .line { font-size:clamp(1.2rem,4.6vw,1.8rem); line-height:1.55; margin:12px 0; opacity:0;
          transform:translateY(16px); transition:opacity 1.2s ease, transform 1.2s ease;
          text-shadow:0 0 18px rgba(255,126,182,.6); }
  .line.show { opacity:1; transform:none; }
  .line b { color:var(--pink); }
  .btn { margin-top:26px; padding:15px 32px; border:0; border-radius:999px;
         background:linear-gradient(135deg,#ff7eb6,#ff2e88); color:#fff; font-size:1.1rem; font-weight:700;
         cursor:pointer; box-shadow:0 0 30px rgba(255,46,136,.7); animation:beat 1.4s infinite; }
  .hide { display:none; }
  .final { font-size:clamp(2.4rem,10vw,4.6rem); font-weight:800;
           background:linear-gradient(90deg,#fff,#ff7eb6,#fff,#ff2e88);
           background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
           animation:shine 3s linear infinite; }
  @keyframes shine { to{background-position:300% 0} }
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div class="stage">
  <div class="scene on" id="s0">
    <div class="gift" id="gift">🎁</div>
    <h1>Mam coś dla Ciebie…</h1>
    <p class="hint">Kliknij prezent 💗</p>
  </div>

  <div class="scene" id="s1"><div class="count" id="num">3</div></div>

  <div class="scene" id="s2">
    <div class="bigheart">💖</div>
    <h1>Wszystkiego najlepszego!</h1>
    <div id="lines"></div>
    <button class="btn hide" id="more">Kliknij jeszcze raz 💝</button>
  </div>

  <div class="scene" id="s3">
    <div class="bigheart">💗</div>
    <div class="final" id="final"></div>
    <p class="hint" style="margin-top:18px">Dotknij ekranu, żeby zobaczyć więcej ✨</p>
  </div>
</div>

<script>
  // ====== TU ZMIENIASZ TEKST ======
  const LINES = [
    "Dziś jest <b>Twój dzień</b> 🌸",
    "Życzę Ci samych pięknych chwil,",
    "uśmiechu, który nie schodzi z twarzy,",
    "i wszystkiego, o czym marzysz. ✨",
    "Dziękuję, że jesteś. <b>Naprawdę.</b> 💗"
  ];
  const FINAL = "Jesteś najlepsza! 💕";
  // =================================

  const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  let W, H;
  const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  addEventListener('resize', resize); resize();

  const EMO = ['💗','💖','💕','💝','🌸','✨','💘'];
  let parts = [], stars = [], rain = 0.07;
  for (let i = 0; i < 90; i++) stars.push({x:Math.random(), y:Math.random(), r:Math.random()*1.8+.3, p:Math.random()*6.28});

  function rainHeart() {
    parts.push({x:Math.random()*W, y:-30, vx:0, vy:.7+Math.random()*1.6, s:14+Math.random()*28,
                e:EMO[Math.random()*EMO.length|0], life:1, g:0, d:Math.random()*6.28, sway:true});
  }
  function burstAt(x, y, n=36) {
    for (let i = 0; i < n; i++) {
      const a = Math.random()*6.28, sp = 2+Math.random()*7;
      parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, s:14+Math.random()*22,
                  e:EMO[Math.random()*EMO.length|0], life:1, g:.12, d:0, sway:false});
    }
  }
  function fireworks(times) {
    for (let i = 0; i < times; i++)
      setTimeout(() => burstAt(W*(.15+Math.random()*.7), H*(.15+Math.random()*.5), 40), i*350);
  }

  let t = 0;
  (function loop() {
    t += .02;
    ctx.clearRect(0,0,W,H);
    for (const s of stars) {
      ctx.globalAlpha = .4 + .6*Math.abs(Math.sin(t+s.p));
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, 6.28); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (Math.random() < rain) rainHeart();
    parts = parts.filter(p => p.life > 0 && p.y < H+40);
    for (const p of parts) {
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.d += .03;
      if (p.sway) p.x += Math.sin(p.d)*.8; else p.life -= .008;
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.font = p.s + 'px serif';
      ctx.fillText(p.e, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  })();

  // serduszka za palcem / myszką + wybuch po dotknięciu
  let last = 0;
  addEventListener('pointermove', e => {
    const n = performance.now(); if (n - last < 45) return; last = n;
    parts.push({x:e.clientX, y:e.clientY, vx:(Math.random()-.5)*1.5, vy:-1-Math.random()*1.5, s:12+Math.random()*14,
                e:EMO[Math.random()*EMO.length|0], life:1, g:.02, d:0, sway:false});
  });
  addEventListener('pointerdown', e => burstAt(e.clientX, e.clientY, 18));

  function show(id) {
    document.querySelectorAll('.scene').forEach(s => s.classList.remove('on'));
    document.getElementById(id).classList.add('on');
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));

  document.getElementById('gift').addEventListener('click', async () => {
    show('s1');
    const num = document.getElementById('num');
    for (const n of ['3','2','1']) {
      num.textContent = n; num.style.animation = 'none'; void num.offsetWidth; num.style.animation = '';
      await wait(900);
    }
    show('s2');
    rain = .25; fireworks(6);
    const box = document.getElementById('lines');
    for (const l of LINES) {
      const d = document.createElement('div'); d.className = 'line'; d.innerHTML = l; box.appendChild(d);
      await wait(60); d.classList.add('show'); await wait(1500);
    }
    document.getElementById('more').classList.remove('hide');
  });

  document.getElementById('more').addEventListener('click', async () => {
    show('s3');
    rain = .5; fireworks(14);
    const f = document.getElementById('final');
    for (let i = 1; i <= FINAL.length; i++) { f.textContent = FINAL.slice(0, i); await wait(90); }
    setInterval(() => fireworks(2), 2500);
  });
</script>
</body>
</html>
